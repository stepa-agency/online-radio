services:
  icecast:
    build: ./icecast
    container_name: radio-icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-adminhackme}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:-relayhackme}
      ICECAST_HOSTNAME: icecast
    volumes:
      - icecast-logs:/var/log/icecast2
    restart: unless-stopped
    networks:
      - radio

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: radio-liquidsoap
    depends_on:
      - icecast
    ports:
      - "1234:1234"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
    volumes:
      - ./liquidsoap/radio.liq:/radio.liq:ro
      - ./music:/music
    command: ["/radio.liq"]
    restart: unless-stopped
    networks:
      - radio

  api:
    build: ./api
    container_name: radio-api
    depends_on:
      - liquidsoap
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: 1234
      MUSIC_DIR: /music
      DB_PATH: /data/queue.db
    volumes:
      - ./music:/music
      - api-data:/data
    restart: unless-stopped
    networks:
      - radio

  web:
    image: node:20-slim
    container_name: radio-web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:3001
      VITE_STREAM_URL: http://localhost:8000/stream
    volumes:
      - ./frontend:/app
    networks:
      - radio

networks:
  radio:
    driver: bridge

volumes:
  icecast-logs:
  api-data:
